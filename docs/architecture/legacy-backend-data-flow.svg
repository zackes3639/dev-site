<svg width="680" height="410" viewBox="0 0 680 410" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>zacksimon.dev — legacy backend data flow</title>
  <desc>Public site pages call a read-oriented API Gateway for posts and subscriptions, while the legacy admin page calls a separate write API. Lambdas behind both gateways read and write the blog posts table, the subscribers table, and a shared slug lock table in DynamoDB.</desc>
  <!-- Hand-maintained diagram; update rules in docs/architecture/README.md -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .th { font-size: 14px; font-weight: 500; }
    .ts { font-size: 12px; font-weight: 400; }
    .arr { stroke: #5F5E5A; stroke-width: 1.5; fill: none; }
    .c-gray rect { fill: #F1EFE8; stroke: #5F5E5A; }
    .c-gray .th { fill: #444441; }
    .c-gray .ts { fill: #5F5E5A; }
    .c-purple rect { fill: #EEEDFE; stroke: #534AB7; }
    .c-purple .th { fill: #3C3489; }
    .c-purple .ts { fill: #534AB7; }
    .c-teal rect { fill: #E1F5EE; stroke: #0F6E56; }
    .c-teal .th { fill: #085041; }
    .c-teal .ts { fill: #0F6E56; }
    .legend { fill: #5F5E5A; }
  </style>
  <rect x="0" y="0" width="680" height="410" fill="#FFFFFF"/>
  <g class="c-gray">
    <rect x="60" y="40" width="250" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="185" y="58" text-anchor="middle" dominant-baseline="central">Public site pages</text>
    <text class="ts" x="185" y="76" text-anchor="middle" dominant-baseline="central">blog.js, subscribe forms</text>
  </g>
  <g class="c-gray">
    <rect x="400" y="40" width="240" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="520" y="58" text-anchor="middle" dominant-baseline="central">Legacy admin page</text>
    <text class="ts" x="520" y="76" text-anchor="middle" dominant-baseline="central">/admin/, password writes</text>
  </g>
  <g class="c-purple">
    <rect x="60" y="160" width="250" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="185" y="178" text-anchor="middle" dominant-baseline="central">Read API + Lambdas</text>
    <text class="ts" x="185" y="196" text-anchor="middle" dominant-baseline="central">posts, subscribe, unsubscribe</text>
  </g>
  <g class="c-purple">
    <rect x="400" y="160" width="240" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="520" y="178" text-anchor="middle" dominant-baseline="central">Write API + Lambda</text>
    <text class="ts" x="520" y="196" text-anchor="middle" dominant-baseline="central">POST /posts, password check</text>
  </g>
  <g class="c-teal">
    <rect x="40" y="290" width="180" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="130" y="308" text-anchor="middle" dominant-baseline="central">Subscribers table</text>
    <text class="ts" x="130" y="326" text-anchor="middle" dominant-baseline="central">email, status</text>
  </g>
  <g class="c-teal">
    <rect x="250" y="290" width="190" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="345" y="308" text-anchor="middle" dominant-baseline="central">ZS_DEV_BLOG_POSTS</text>
    <text class="ts" x="345" y="326" text-anchor="middle" dominant-baseline="central">blog posts</text>
  </g>
  <g class="c-teal">
    <rect x="460" y="290" width="180" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="550" y="308" text-anchor="middle" dominant-baseline="central">briefly_post_slugs</text>
    <text class="ts" x="550" y="326" text-anchor="middle" dominant-baseline="central">shared slug locks</text>
  </g>
  <line x1="185" y1="96" x2="185" y2="150" class="arr" marker-end="url(#arrow)"/>
  <line x1="520" y1="96" x2="520" y2="150" class="arr" marker-end="url(#arrow)"/>
  <line x1="130" y1="216" x2="130" y2="280" class="arr" marker-end="url(#arrow)"/>
  <line x1="280" y1="216" x2="330" y2="280" class="arr" marker-end="url(#arrow)"/>
  <line x1="450" y1="216" x2="370" y2="280" class="arr" marker-end="url(#arrow)"/>
  <line x1="550" y1="216" x2="550" y2="280" class="arr" marker-end="url(#arrow)"/>
  <g class="c-gray"><rect x="40" y="374" width="12" height="12" rx="2" stroke-width="0.5"/></g>
  <text class="ts legend" x="58" y="380" dominant-baseline="central">Browser pages</text>
  <g class="c-purple"><rect x="220" y="374" width="12" height="12" rx="2" stroke-width="0.5"/></g>
  <text class="ts legend" x="238" y="380" dominant-baseline="central">API Gateway + Lambda</text>
  <g class="c-teal"><rect x="430" y="374" width="12" height="12" rx="2" stroke-width="0.5"/></g>
  <text class="ts legend" x="448" y="380" dominant-baseline="central">DynamoDB tables</text>
</svg>
