<svg width="680" height="540" viewBox="0 0 680 540" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Build Log newsletter delivery pipeline</title>
  <desc>A Build Log post detector creates campaign records in DynamoDB. An admin reviews campaigns and sends tests before SES sends approved email. Delivery logs record send outcomes, subscribers and unsubscribe state control suppression, and public subscriber blasts remain disabled until SES production access is approved.</desc>
  <!-- Hand-maintained diagram; update rules in docs/architecture/README.md -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .th { font-size: 14px; font-weight: 500; }
    .ts { font-size: 12px; font-weight: 400; }
    .arr { stroke: #5F5E5A; stroke-width: 1.5; fill: none; }
    .c-gray rect { fill: #F1EFE8; stroke: #5F5E5A; }
    .c-gray .th { fill: #444441; }
    .c-gray .ts { fill: #5F5E5A; }
    .c-purple rect { fill: #EEEDFE; stroke: #534AB7; }
    .c-purple .th { fill: #3C3489; }
    .c-purple .ts { fill: #534AB7; }
    .c-teal rect { fill: #E1F5EE; stroke: #0F6E56; }
    .c-teal .th { fill: #085041; }
    .c-teal .ts { fill: #0F6E56; }
    .legend { fill: #5F5E5A; }
  </style>
  <rect x="0" y="0" width="680" height="540" fill="#FFFFFF"/>
  <g class="c-purple">
    <rect x="60" y="40" width="220" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="170" y="58" text-anchor="middle" dominant-baseline="central">Build Log post detector</text>
    <text class="ts" x="170" y="76" text-anchor="middle" dominant-baseline="central">new published posts</text>
  </g>
  <g class="c-teal">
    <rect x="400" y="40" width="220" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="510" y="58" text-anchor="middle" dominant-baseline="central">Campaigns table</text>
    <text class="ts" x="510" y="76" text-anchor="middle" dominant-baseline="central">draft, test, approved</text>
  </g>
  <g class="c-gray">
    <rect x="230" y="160" width="220" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="178" text-anchor="middle" dominant-baseline="central">Admin review + test</text>
    <text class="ts" x="340" y="196" text-anchor="middle" dominant-baseline="central">no subscriber blast by default</text>
  </g>
  <g class="c-purple">
    <rect x="230" y="280" width="220" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="298" text-anchor="middle" dominant-baseline="central">SES email</text>
    <text class="ts" x="340" y="316" text-anchor="middle" dominant-baseline="central">verified ids, prod pending</text>
  </g>
  <g class="c-teal">
    <rect x="40" y="410" width="180" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="130" y="428" text-anchor="middle" dominant-baseline="central">Delivery logs</text>
    <text class="ts" x="130" y="446" text-anchor="middle" dominant-baseline="central">attempts, results</text>
  </g>
  <g class="c-teal">
    <rect x="250" y="410" width="180" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="428" text-anchor="middle" dominant-baseline="central">Subscribers table</text>
    <text class="ts" x="340" y="446" text-anchor="middle" dominant-baseline="central">active email list</text>
  </g>
  <g class="c-teal">
    <rect x="460" y="410" width="180" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="550" y="428" text-anchor="middle" dominant-baseline="central">Unsubscribe state</text>
    <text class="ts" x="550" y="446" text-anchor="middle" dominant-baseline="central">suppression guard</text>
  </g>
  <line x1="280" y1="68" x2="390" y2="68" class="arr" marker-end="url(#arrow)"/>
  <path d="M510 96 L510 126 L340 126 L340 150" class="arr" marker-end="url(#arrow)"/>
  <line x1="340" y1="216" x2="340" y2="270" class="arr" marker-end="url(#arrow)"/>
  <line x1="340" y1="336" x2="340" y2="400" class="arr" marker-end="url(#arrow)"/>
  <path d="M295 336 L130 390 L130 400" class="arr" marker-end="url(#arrow)"/>
  <path d="M385 336 L550 390 L550 400" class="arr" marker-end="url(#arrow)"/>
  <path d="M460 438 L440 438" class="arr" marker-end="url(#arrow)"/>
  <path d="M250 438 L230 438" class="arr" marker-end="url(#arrow)"/>
  <g class="c-gray"><rect x="40" y="504" width="12" height="12" rx="2" stroke-width="0.5"/></g>
  <text class="ts legend" x="58" y="510" dominant-baseline="central">Admin / review</text>
  <g class="c-purple"><rect x="220" y="504" width="12" height="12" rx="2" stroke-width="0.5"/></g>
  <text class="ts legend" x="238" y="510" dominant-baseline="central">AWS jobs / SES</text>
  <g class="c-teal"><rect x="420" y="504" width="12" height="12" rx="2" stroke-width="0.5"/></g>
  <text class="ts legend" x="438" y="510" dominant-baseline="central">DynamoDB / delivery state</text>
</svg>
