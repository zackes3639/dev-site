<svg width="680" height="730" viewBox="0 0 680 730" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Briefly — publishing pipeline</title>
  <desc>The Briefly admin UI signs in with Cognito and calls a JWT-protected HTTP API. A Step Functions workflow generates drafts with Amazon Bedrock, a human approves them in the admin UI, and a publish Lambda takes a slug lock and writes the post to both the briefly_posts table and the legacy ZS_DEV_BLOG_POSTS table that feeds the live Build Log.</desc>
  <!-- Hand-maintained diagram; update rules in docs/architecture/README.md -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .th { font-size: 14px; font-weight: 500; }
    .ts { font-size: 12px; font-weight: 400; }
    .arr { stroke: #5F5E5A; stroke-width: 1.5; fill: none; }
    .c-gray rect { fill: #F1EFE8; stroke: #5F5E5A; }
    .c-gray .th { fill: #444441; }
    .c-gray .ts { fill: #5F5E5A; }
    .c-purple rect { fill: #EEEDFE; stroke: #534AB7; }
    .c-purple .th { fill: #3C3489; }
    .c-purple .ts { fill: #534AB7; }
    .c-teal rect { fill: #E1F5EE; stroke: #0F6E56; }
    .c-teal .th { fill: #085041; }
    .c-teal .ts { fill: #0F6E56; }
    .c-coral rect { fill: #FAECE7; stroke: #993C1D; }
    .c-coral .th { fill: #712B13; }
    .c-coral .ts { fill: #993C1D; }
    .legend { fill: #5F5E5A; }
  </style>
  <rect x="0" y="0" width="680" height="730" fill="#FFFFFF"/>
  <g class="c-gray">
    <rect x="180" y="40" width="200" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="280" y="58" text-anchor="middle" dominant-baseline="central">Briefly admin UI</text>
    <text class="ts" x="280" y="76" text-anchor="middle" dominant-baseline="central">/admin/briefly/, Cognito</text>
  </g>
  <g class="c-purple">
    <rect x="180" y="156" width="200" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="280" y="174" text-anchor="middle" dominant-baseline="central">Briefly HTTP API</text>
    <text class="ts" x="280" y="192" text-anchor="middle" dominant-baseline="central">API Gateway, JWT auth</text>
  </g>
  <g class="c-purple">
    <rect x="180" y="272" width="200" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="280" y="290" text-anchor="middle" dominant-baseline="central">Draft generation</text>
    <text class="ts" x="280" y="308" text-anchor="middle" dominant-baseline="central">Step Functions + Lambda</text>
  </g>
  <g class="c-coral">
    <rect x="460" y="272" width="170" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="545" y="290" text-anchor="middle" dominant-baseline="central">Amazon Bedrock</text>
    <text class="ts" x="545" y="308" text-anchor="middle" dominant-baseline="central">Nova Pro model</text>
  </g>
  <g class="c-gray">
    <rect x="180" y="388" width="200" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="280" y="406" text-anchor="middle" dominant-baseline="central">Human review</text>
    <text class="ts" x="280" y="424" text-anchor="middle" dominant-baseline="central">approve in admin UI</text>
  </g>
  <g class="c-purple">
    <rect x="180" y="504" width="200" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="280" y="522" text-anchor="middle" dominant-baseline="central">Publish Lambda</text>
    <text class="ts" x="280" y="540" text-anchor="middle" dominant-baseline="central">slug lock + dual write</text>
  </g>
  <g class="c-teal">
    <rect x="60" y="620" width="190" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="155" y="638" text-anchor="middle" dominant-baseline="central">briefly_posts</text>
    <text class="ts" x="155" y="656" text-anchor="middle" dominant-baseline="central">Briefly archive</text>
  </g>
  <g class="c-teal">
    <rect x="380" y="620" width="230" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="495" y="638" text-anchor="middle" dominant-baseline="central">ZS_DEV_BLOG_POSTS</text>
    <text class="ts" x="495" y="656" text-anchor="middle" dominant-baseline="central">live Build Log feed</text>
  </g>
  <line x1="280" y1="96" x2="280" y2="146" class="arr" marker-end="url(#arrow)"/>
  <line x1="280" y1="212" x2="280" y2="262" class="arr" marker-end="url(#arrow)"/>
  <line x1="390" y1="300" x2="450" y2="300" class="arr" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line x1="280" y1="328" x2="280" y2="378" class="arr" marker-end="url(#arrow)"/>
  <line x1="280" y1="444" x2="280" y2="494" class="arr" marker-end="url(#arrow)"/>
  <line x1="245" y1="560" x2="170" y2="610" class="arr" marker-end="url(#arrow)"/>
  <line x1="315" y1="560" x2="470" y2="610" class="arr" marker-end="url(#arrow)"/>
  <g class="c-gray"><rect x="40" y="700" width="12" height="12" rx="2" stroke-width="0.5"/></g>
  <text class="ts legend" x="58" y="706" dominant-baseline="central">People / UI</text>
  <g class="c-purple"><rect x="190" y="700" width="12" height="12" rx="2" stroke-width="0.5"/></g>
  <text class="ts legend" x="208" y="706" dominant-baseline="central">AWS compute</text>
  <g class="c-teal"><rect x="350" y="700" width="12" height="12" rx="2" stroke-width="0.5"/></g>
  <text class="ts legend" x="368" y="706" dominant-baseline="central">DynamoDB</text>
  <g class="c-coral"><rect x="520" y="700" width="12" height="12" rx="2" stroke-width="0.5"/></g>
  <text class="ts legend" x="538" y="706" dominant-baseline="central">AI model</text>
</svg>
