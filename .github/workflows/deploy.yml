name: Deploy static site to AWS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
  CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Briefly admin
        env:
          VITE_BRIEFLY_API_BASE: https://yp2u8kczt9.execute-api.us-east-2.amazonaws.com
        run: npm run build --workspace @briefly/admin-briefly

      - name: Configure AWS credentials from GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Load site password from SSM
        env:
          SITE_ACCESS_PASSWORD_PARAMETER: /zacksimon/site/owner-password
        run: |
          SITE_ACCESS_PASSWORD="$(aws ssm get-parameter \
            --name "${SITE_ACCESS_PASSWORD_PARAMETER}" \
            --with-decryption \
            --query 'Parameter.Value' \
            --output text)"
          echo "::add-mask::${SITE_ACCESS_PASSWORD}"
          delimiter="$(uuidgen)"
          {
            echo "SITE_ACCESS_PASSWORD<<${delimiter}"
            printf '%s\n' "${SITE_ACCESS_PASSWORD}"
            echo "${delimiter}"
          } >> "${GITHUB_ENV}"

      - name: Deploy site password gate
        run: |
          if [[ -z "${SITE_ACCESS_PASSWORD:-}" ]]; then
            echo "SITE_ACCESS_PASSWORD was not loaded from SSM."
            exit 1
          fi
          ./scripts/deploy-site-access-gate.sh

      - name: Upload site files to S3
        run: |
          aws s3 sync . s3://${S3_BUCKET_NAME} \
            --delete \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude ".claude/*" \
            --exclude ".DS_Store" \
            --exclude "lambda/*" \
            --exclude "apps/*" \
            --exclude "services/*" \
            --exclude "packages/*" \
            --exclude "infra/*" \
            --exclude "edge/*" \
            --exclude "docs/*" \
            --exclude "node_modules/*" \
            --exclude "admin/briefly/*" \
            --exclude "package.json" \
            --exclude "package-lock.json" \
            --exclude "tsconfig*.json" \
            --exclude "CLAUDE.md" \
            --exclude "AGENTS.md" \
            --exclude "BRAND.md" \
            --exclude "DESIGN.md" \
            --exclude "OPEN_BUGS.md" \
            --exclude "TECHSTACK.md" \
            --exclude "VOICE.md" \
            --exclude "CHANGELOG.md" \
            --exclude "HANDOFF.md" \
            --exclude "PLANS.md" \
            --exclude "README.md" \
            --exclude "IDEAS.md" \
            --exclude "memory/*"

      # aws s3 sync guesses content types from the runner's mime tables, which
      # may not know .webmanifest — re-upload it with the correct type.
      - name: Set web manifest content type
        run: |
          aws s3 cp site.webmanifest s3://${S3_BUCKET_NAME}/site.webmanifest \
            --content-type "application/manifest+json"

      - name: Upload Briefly admin to S3
        run: |
          aws s3 sync apps/admin-briefly/dist s3://${S3_BUCKET_NAME}/admin/briefly/ \
            --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${CLOUDFRONT_DISTRIBUTION_ID} \
            --paths "/*"

      - name: Run smoke test (with retries)
        env:
          SITE_URL: https://zacksimon.dev
          PUBLIC_API_BASE: https://33o1s2l689.execute-api.us-east-2.amazonaws.com
          WRITE_API_BASE: https://tblw8hlwu0.execute-api.us-east-2.amazonaws.com
        run: |
          for i in 1 2 3 4 5 6; do
            if ./scripts/smoke-test.sh; then
              exit 0
            fi
            echo "Smoke test attempt ${i} failed. Retrying in 20s..."
            sleep 20
          done
          echo "Smoke test failed after retries."
          exit 1
